# web: Next.js 화면. /api 등 백엔드 경로는 rewrites로 api 컨테이너에 넘긴다.
# api: Spring Boot. 공용 MariaDB(~/infra/db)에 'shared' 네트워크로 접속(호스트명 'db').
# HTTPS는 공용 Caddy(~/infra/proxy)가 'proxy' 네트워크로 연결한다. 백엔드 경로는 api로, 나머지는 web으로 보낸다.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: pdf-sign-request-api
    container_name: pdf-sign-request-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-storage:/data/storage
    networks: [default, shared, proxy]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        BACKEND_URL: http://api:8080
    image: pdf-sign-request-web
    container_name: pdf-sign-request-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8002:3000"
    networks: [default, proxy]

volumes:
  app-storage:

networks:
  shared:
    external: true
  proxy:
    external: true
