# DB는 공용 MariaDB(~/infra/db)를 사용한다. 'shared' 네트워크에서 호스트명 'db'로 접속.
# HTTPS는 공용 Caddy(~/infra/proxy)가 'proxy' 네트워크로 이 컨테이너에 연결한다.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pdf-sign-request-app
    container_name: pdf-sign-request-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8002:8080"
    volumes:
      - app-storage:/data/storage
    networks: [shared, proxy]

volumes:
  app-storage:

networks:
  shared:
    external: true
  proxy:
    external: true
