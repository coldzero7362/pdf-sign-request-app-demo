spring:
  application:
    name: pdf-sign-request-app
  datasource:
    url: jdbc:mariadb://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:docsign}
    username: ${DB_USER:docsign}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            # 프록시 뒤에서도 항상 같은 주소를 쓰도록 고정 (Google 콘솔에 등록한 값과 같아야 함)
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  # Caddy가 붙이는 X-Forwarded-* 를 Tomcat 단계에서 반영 (https 판단, Secure 쿠키)
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 8h
      # 세션 ID를 URL(;jsessionid=)에 붙이지 않는다. 주소 공유·기록·Referer로 새는 것을 막는다.
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  storage-dir: ${APP_STORAGE_DIR:./storage}
  mail:
    # 비어 있으면 메일을 보내지 않고 로그에만 남긴다 (개발·테스트용)
    from: ${MAIL_USERNAME:}
    from-name: PDF 서명 요청
    async: true
