spring:
  application:
    name: pdf-sign-request-app
  datasource:
    url: jdbc:mariadb://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:docsign}
    username: ${DB_USER:docsign}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  storage-dir: ${APP_STORAGE_DIR:./storage}
